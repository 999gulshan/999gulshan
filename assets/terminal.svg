<svg width="800" height="330" viewBox="0 0 800 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gulshan // Developer Terminal — glassmorphism + neon -->
  <style>
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 15px; }
    .prompt { fill: #22d3ee; }
    .cmd    { fill: #e879f9; }
    .out    { fill: #d1d5db; }
    .green  { fill: #4ade80; }

    /* sequential typing reveal per line */
    @keyframes reveal { from { width: 0; } to { width: 700px; } }
    .l1 rect { animation: reveal 1.0s steps(20,end) forwards 0.6s;  width: 0; }
    .l2 rect { animation: reveal 0.8s steps(14,end) forwards 2.0s;  width: 0; }
    .l3 rect { animation: reveal 1.2s steps(28,end) forwards 3.2s;  width: 0; }
    .l4 rect { animation: reveal 0.9s steps(22,end) forwards 4.8s;  width: 0; }
    .l5 rect { animation: reveal 1.2s steps(30,end) forwards 6.0s;  width: 0; }
    .l6 rect { animation: reveal 0.8s steps(12,end) forwards 7.6s;  width: 0; }
    .l7 rect { animation: reveal 1.4s steps(34,end) forwards 8.6s;  width: 0; }

    @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
    .cursor { animation: blink 1s step-end infinite; }

    @keyframes statusPulse { 0%,100% {opacity:1;} 50% {opacity:.4;} }
    .dot-live { animation: statusPulse 1.6s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="tframe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- glass card -->
  <rect x="4" y="4" width="792" height="322" rx="16" fill="#0a0a0f" fill-opacity="0.86" stroke="url(#tframe)" stroke-width="1.5" filter="url(#softGlow)"/>
  <rect x="4" y="4" width="792" height="322" rx="16" fill="url(#tframe)" fill-opacity="0.04"/>

  <!-- title bar -->
  <rect x="4" y="4" width="792" height="42" rx="16" fill="#ffffff" fill-opacity="0.045"/>
  <line x1="4" y1="46" x2="796" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="32" cy="25" r="6.5" fill="#ff5f57"/>
  <circle cx="54" cy="25" r="6.5" fill="#febc2e"/>
  <circle cx="76" cy="25" r="6.5" fill="#28c840"/>
  <text x="400" y="30" text-anchor="middle" class="mono" fill="#9ca3af" font-size="13">gulshan@dev: ~/portfolio — zsh ⚡</text>
  <circle class="dot-live" cx="756" cy="25" r="5" fill="#4ade80"/>
  <text x="746" y="30" text-anchor="end" class="mono" fill="#4ade80" font-size="12">ONLINE</text>

  <!-- terminal lines -->
  <g class="l1"><clipPath id="c1"><rect x="28" y="66" height="24"/></clipPath>
    <text x="28" y="84" class="mono" clip-path="url(#c1)"><tspan class="prompt">❯ </tspan><tspan class="cmd">whoami</tspan></text></g>
  <g class="l2"><clipPath id="c2"><rect x="28" y="94" height="24"/></clipPath>
    <text x="28" y="112" class="mono out" clip-path="url(#c2)">Gulshan ✦ Full-Stack Developer</text></g>

  <g class="l3"><clipPath id="c3"><rect x="28" y="128" height="24"/></clipPath>
    <text x="28" y="146" class="mono" clip-path="url(#c3)"><tspan class="prompt">❯ </tspan><tspan class="cmd">cat current_project.txt</tspan></text></g>
  <g class="l4"><clipPath id="c4"><rect x="28" y="156" height="24"/></clipPath>
    <text x="28" y="174" class="mono out" clip-path="url(#c4)">AI + Full-Stack Apps 🤖⚡</text></g>

  <g class="l5"><clipPath id="c5"><rect x="28" y="190" height="24"/></clipPath>
    <text x="28" y="208" class="mono" clip-path="url(#c5)"><tspan class="prompt">❯ </tspan><tspan class="cmd">./status.sh --now</tspan></text></g>
  <g class="l6"><clipPath id="c6"><rect x="28" y="218" height="24"/></clipPath>
    <text x="28" y="236" class="mono green" clip-path="url(#c6)">▸ Coding... [██████████░░] 87%</text></g>

  <g class="l7"><clipPath id="c7"><rect x="28" y="252" height="24"/></clipPath>
    <text x="28" y="270" class="mono" clip-path="url(#c7)"><tspan class="prompt">❯ </tspan><tspan class="cmd">echo $MOTTO</tspan></text></g>
  <text x="28" y="298" class="mono" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="10.2s" dur="0.3s" fill="freeze"/><tspan fill="#a855f7">"Build the future, </tspan><tspan fill="#22d3ee">one commit at a time."</tspan></text>

  <rect class="cursor" x="28" y="306" width="10" height="17" fill="#22d3ee"/>
</svg>
